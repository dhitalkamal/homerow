[package]
name = "homerow"
version = "0.1.0"
edition = "2024"
description = "Terminal trainer for touch typing and Mac shortcuts"
license = "MIT"
repository = "https://github.com/dhitalkamal/homerow"
readme = "README.md"
keywords = ["typing", "tui", "terminal", "shortcuts", "practice"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tui-big-text = "0.8.10"

[dev-dependencies]
tempfile = "3.27.0"
