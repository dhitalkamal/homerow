[package]
name = "keyup"
version = "0.2.0"
edition = "2024"
description = "Terminal trainer for touch typing and Mac shortcuts"
license = "MIT"
repository = "https://github.com/dhitalkamal/keyup"
readme = "README.md"
keywords = ["typing", "tui", "terminal", "shortcuts", "practice"]
categories = ["command-line-utilities"]

[dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tui-big-text = "0.8.10"
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"
